# tmux config for the ABL editing setup. Runs on its own server (tmux -L abl),
# so it doesn't touch ~/.tmux.conf or other tmux sessions.
#
# Panes are found by role through window options set by abl-tmux.sh:
#   @editor_pane (nvim), @claude_pane, @shell_pane

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys,wezterm*:RGB:extkeys"
set -s extended-keys on       # Ctrl+Shift+key reaches nvim when the terminal sends it
set -s escape-time 10         # no lag after Esc in nvim
set -s set-clipboard on       # forward OSC 52 copies to the terminal clipboard
set -g focus-events on        # lets nvim reload files claude changed
set -g mouse on               # click to focus, drag borders, wheel scrolls
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix: Ctrl+B as usual, but inside nvim Ctrl+B toggles the explorer (VS Code).
# Alt+B is the prefix everywhere, including nvim. Prefix then b sends a literal Ctrl+B.
set -g prefix None
set -g prefix2 M-b
bind -n C-b if -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys C-b' 'switch-client -T prefix'
bind b send-keys C-b

# Ctrl+J: jump between editor and terminal (VS Code panel toggle).
# In any other pane (claude uses it for a newline) Ctrl+J passes through.
bind -n C-j if -F '#{==:#{pane_id},#{@editor_pane}}' \
    'run-shell -b "tmux select-pane -t #{@shell_pane}"' \
    'if -F "#{==:#{pane_id},#{@shell_pane}}" "run-shell -b \"tmux select-pane -t #{@editor_pane}\"" "send-keys C-j"'

# Alt+1/2/3: focus editor / claude / terminal. Alt+Z: maximize the current pane.
# M-& M-é M-" are the same keys unshifted on AZERTY.
bind -n M-1 run-shell -b 'tmux select-pane -t #{@editor_pane}'
bind -n M-2 run-shell -b 'tmux select-pane -t #{@claude_pane}'
bind -n M-3 run-shell -b 'tmux select-pane -t #{@shell_pane}'
bind -n M-& run-shell -b 'tmux select-pane -t #{@editor_pane}'
bind -n M-é run-shell -b 'tmux select-pane -t #{@claude_pane}'
bind -n 'M-"' run-shell -b 'tmux select-pane -t #{@shell_pane}'
bind -n M-z resize-pane -Z

# Ctrl+click on a file name (file, file:line) in the terminal or claude pane opens it in nvim
# (abl-open.sh). The click still reaches the pane as before, so the terminal's own Ctrl+click
# on URLs and nvim's Ctrl+click (go to definition) keep working.
bind -n C-MouseDown1Pane select-pane -t = \; send-keys -M \; \
    if -F '#{!=:#{pane_id},#{@editor_pane}}' \
    "run-shell -b '#{q:@abl_open} #{q:mouse_word} #{q:pane_current_path} #{q:@nvim_socket} #{@editor_pane} #{q:socket_path}'"

# New panes and windows open in the current directory
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file '#{@abl_conf}' \; display 'tmux.conf reloaded'

# Status bar with a key reminder
set -g status-style 'bg=#232136,fg=#e0def4'
set -g status-left '#[bold] #S #[default] '
set -g status-left-length 40
set -g status-right '#{?client_prefix,#[reverse] PREFIX #[default] ,}Alt+1/2/3 panes · Ctrl+J terminal · Alt+Z zoom · Alt+B prefix '
set -g status-right-length 100
set -g pane-active-border-style 'fg=#c4a7e7'
set -g pane-border-style 'fg=#44415a'
